<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="glomium — creative INFINITELY.">
<title>glomium</title>
<link rel="icon" href="assets/infinity.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&amp;display=swap" rel="stylesheet">
<link rel="preload" href="assets/infinity.svg" as="image" type="image/svg+xml">
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@keyframes cue { 0% { transform: scaleY(0); transform-origin: top; } 49% { transform: scaleY(1); transform-origin: top; } 51% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
@media (pointer: coarse) { [data-grain] { display: none; } }
@media (prefers-reduced-motion: reduce) { [data-cue] { animation: none !important; } }
body { margin: 0; background: #FFFFFF; color: #1B1D1E; font-family: 'Jost', Helvetica, sans-serif; font-weight: 300; overflow-x: clip; -webkit-font-smoothing: antialiased; }
a { color: #8A9390; text-decoration: none; }
a:hover { color: #0E8E72; }
::selection { background: #10AF8B; color: #FFFFFF; }
</style>
</helmet>

<div style="position: relative; background: #FFFFFF;">

  <div aria-hidden="true" style="position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;">
    <div ref="{{ glowRef }}" style="position: absolute; left: 50%; top: 50%; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; background: radial-gradient(closest-side, rgba(16,175,139,.10), rgba(16,175,139,.04) 45%, rgba(16,175,139,0) 100%); opacity: 0; transition: opacity 3s ease 1.4s; will-change: transform;"></div>
    <div data-grain="" style="position: absolute; inset: 0; opacity: .05; background-image: url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>&quot;);"></div>
  </div>

  <div ref="{{ topRef }}" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: max(22px, env(safe-area-inset-top)) clamp(20px, 4vw, 56px) 0; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390; opacity: 0; transition: opacity 1.8s ease 3.2s;">
    <span ref="{{ clockRef }}" style="font-variant-numeric: tabular-nums;"></span>
    <a href="mailto:hello@glomium.in" onMouseEnter="{{ showMail }}" onMouseLeave="{{ hideMail }}" onFocus="{{ showMail }}" onBlur="{{ hideMail }}" aria-label="hello@glomium.in" style="position: relative; display: grid; justify-items: end; color: #8A9390;">
      <span style="grid-area: 1 / 1; opacity: {{ mailWordOp }}; transition: opacity .5s ease;">say hello</span>
      <span style="grid-area: 1 / 1; opacity: {{ mailAddrOp }}; transition: opacity .5s ease; color: #0E8E72; white-space: nowrap;">hello@glomium.in</span>
    </a>
  </div>

  <section data-screen-label="01 glomium" style="position: relative; z-index: 1; height: 100vh; height: 100svh; min-height: 460px; scroll-snap-align: start; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 64px clamp(20px, 4vw, 56px) max(22px, env(safe-area-inset-bottom));">
    <div style="display: grid; place-items: center; min-height: 0;">
      <div ref="{{ markRef }}" style="position: relative; width: clamp(160px, min(40vw, 44vh), 460px); aspect-ratio: 220.86 / 196.03; will-change: transform, opacity;">
        <div ref="{{ inkRef }}" role="img" aria-label="glomium" style="position: absolute; inset: 0; background-color: #10AF8B; background-image: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; background-position: 100% 0; background-repeat: no-repeat; -webkit-mask: url(assets/infinity.svg) center / contain no-repeat; mask: url(assets/infinity.svg) center / contain no-repeat; clip-path: inset(0 100% 0 0); transition: clip-path 2.8s cubic-bezier(.65,0,.25,1) .3s, background-position 2.4s cubic-bezier(.4,0,.2,1) 3.1s;"></div>
      </div>
    </div>
    <div ref="{{ footRef }}" style="display: flex; justify-content: space-between; align-items: center; gap: 16px 32px; opacity: 0; transition: opacity 1.8s ease 2.4s;">
      <img src="assets/wordmark-green.png" alt="glomium" style="display: block; height: clamp(16px, 1.5vw, 21px); width: auto;">
      <div style="width: 1px; height: 32px; background: #E2E7E5; overflow: hidden;"><div data-cue="" style="width: 1px; height: 100%; background: #10AF8B; animation: cue 2.6s cubic-bezier(.65,0,.35,1) infinite;"></div></div>
    </div>
  </section>

  <section ref="{{ twoRef }}" data-screen-label="02 creative INFINITELY" style="position: relative; z-index: 1; height: 100vh; height: 100svh; min-height: 460px; scroll-snap-align: start; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 64px clamp(20px, 4vw, 56px) max(22px, env(safe-area-inset-bottom));">
    <div style="display: grid; place-items: center; min-height: 0;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.2vw, 30px); text-align: center;">
        <span ref="{{ smallRef }}" style="font-size: clamp(13px, 1.6vw, 24px); font-weight: 300; letter-spacing: .5em; margin-right: -.5em; color: #1B1D1E; opacity: 0; transition: opacity 1.6s ease .5s;">creative</span>
        <span ref="{{ bigRef }}" style="font-size: clamp(40px, 11vw, 200px); font-weight: 200; line-height: .9; letter-spacing: .34em; margin-right: -.34em; color: #1B1D1E; white-space: nowrap; opacity: 0; transform: translate3d(0, 28px, 0) scale(.96); transition: opacity 1.8s ease .1s, transform 2.2s cubic-bezier(.2,.8,.2,1) .1s; will-change: transform, opacity;">INFINITELY</span>
      </div>
    </div>
    <div style="display: flex; justify-content: center; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390;">© 2026 glomium</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;drift&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  markRef = React.createRef(); inkRef = React.createRef(); topRef = React.createRef(); footRef = React.createRef(); glowRef = React.createRef();
  twoRef = React.createRef(); smallRef = React.createRef(); bigRef = React.createRef(); clockRef = React.createRef();
  state = { mail: false };

  tick() {
    // local time, nothing else. Written straight to the node — a React render
    // every second was a dropped frame every second on phones.
    const d = new Date(), p = n => String(n).padStart(2, '0');
    if (this.clockRef.current) this.clockRef.current.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  componentDidMount() {
    this.tick(); this.clockT = setInterval(() => this.tick(), 1000);
    if (/(^|\.)glomium\.(co|in)$/.test(location.hostname)) fetch('https://gpyyxvnymmwhpdmijyvb.supabase.co/rest/v1/rpc/log_album_visit', { method: 'POST', headers: { apikey: 'sb_publishable_oesyTPK2JuS1G20t8vS0zw_Yp9bgwd1', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_slug: /^m\./.test(location.hostname) ? 'home-mobile' : 'home', p_meta: (() => { const n = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}; let s = '', tz = ''; try { s = sessionStorage.getItem('g_sid') || ''; if (!s) { s = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); sessionStorage.setItem('g_sid', s); } } catch (e) {} try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {} return { session: s, path: location.pathname + location.search, method: 'GET', status: n.responseStatus || 200, size: Math.round(n.transferSize || n.encodedBodySize || 0) || null, referrer: document.referrer || null, auth: 'anon', screen: screen.width + 'x' + screen.height + '@' + (window.devicePixelRatio || 1), viewport: innerWidth + 'x' + innerHeight, lang: navigator.language || '', tz }; })() }), keepalive: true }).catch(() => {});
    const reduce = this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let done = false;
    // pen stroke wipes the mark on, a single sheen passes along it, then the rest surfaces
    const go = () => { if (done) return; done = true; requestAnimationFrame(() => requestAnimationFrame(() => {
      const ink = this.inkRef.current;
      if (ink) { if (reduce) ink.style.transition = 'none'; ink.style.clipPath = 'inset(0 0% 0 0)'; if (!reduce) ink.style.backgroundPosition = '0% 0'; }
      [this.topRef, this.footRef, this.glowRef].forEach(r => r.current && (r.current.style.opacity = '1'));
      // once the intro fade lands, scroll takes over the wordmark's opacity directly
      setTimeout(() => { this.introDone = true; if (this.footRef.current) this.footRef.current.style.transition = 'none'; this.lastP = -1; this.onScroll(); }, 4400);
    })); };
    const img = new Image(); img.onload = img.onerror = go; img.src = 'assets/infinity.svg';
    setTimeout(go, 1200);

    // page two: the word opens out as it arrives, once
    const reveal = () => {
      if (this.smallRef.current) this.smallRef.current.style.opacity = '1';
      const b = this.bigRef.current;
      if (b) { b.style.opacity = '1'; b.style.transform = 'none'; }
    };
    if (reduce || !('IntersectionObserver' in window)) reveal();
    else {
      this.io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { reveal(); this.io.disconnect(); } }, { threshold: 0.35 });
      if (this.twoRef.current) this.io.observe(this.twoRef.current);
    }
    this.fit = () => {
      // INFINITELY opens to wide tracking — keep the opened word inside the screen
      const b = this.bigRef.current; if (!b) return;
      // phone toolbars fire resize while scrolling — only refit when the width really changed
      if (this.fitW === window.innerWidth) return; this.fitW = window.innerWidth;
      const fs = Math.min(200, Math.max(28, window.innerWidth * 0.86 / (10 * 0.62 + 10 * 0.34)));
      b.style.fontSize = fs.toFixed(1) + 'px';
    };
    this.fit();
    window.addEventListener('resize', this.fit, { passive: true });

    // page one recedes as page two comes up — transform + opacity only
    this.onScroll = () => { if (!this.sraf) this.sraf = requestAnimationFrame(() => {
      this.sraf = 0;
      const p = Math.min(1, Math.max(0, window.scrollY / (this.vh || window.innerHeight)));
      if (p === this.lastP) return; this.lastP = p;
      const m = this.markRef.current;
      if (m) { m.style.opacity = (1 - p * 0.95).toFixed(3); m.style.transform = 'translate3d(' + ((this.x || 0) * 9).toFixed(2) + 'px,' + ((this.y || 0) * 7 + p * this.vh * 0.18).toFixed(1) + 'px,0) scale(' + (1 - p * 0.12).toFixed(4) + ')'; }
      // glomium and the cue leave in the first third of the scroll
      if (this.introDone && this.footRef.current) this.footRef.current.style.opacity = Math.max(0, 1 - p * 3).toFixed(3);
    }); };
    // read the height once, not per frame — the phone toolbar changes innerHeight mid-scroll
    this.vh = window.innerHeight;
    this.onVh = () => { this.vh = window.innerHeight; };
    window.addEventListener('orientationchange', this.onVh, { passive: true });
    window.addEventListener('scroll', this.onScroll, { passive: true });

    // phones: no cursor, and a constantly moving full-screen glow costs more than it gives
    if (reduce || this.props.drift === false || !window.matchMedia('(pointer: fine)').matches) return;
    this.x = this.y = this.tx = this.ty = 0;
    if (window.matchMedia('(pointer: fine)').matches) {
      this.onMove = e => { this.tx = (e.clientX / window.innerWidth - 0.5) * 2; this.ty = (e.clientY / window.innerHeight - 0.5) * 2; this.kick(); };
      window.addEventListener('pointermove', this.onMove, { passive: true });
    } else {
      const t0 = performance.now();
      this.wander = setInterval(() => { const s = (performance.now() - t0) / 1000; this.tx = Math.sin(s * 0.23) * 0.7; this.ty = Math.cos(s * 0.17) * 0.6; this.kick(); }, 50);
    }
  }
  kick() { if (!this.raf) this.raf = requestAnimationFrame(() => this.step()); }
  step() {
    this.raf = 0;
    this.x += (this.tx - this.x) * 0.06; this.y += (this.ty - this.y) * 0.06;
    const w = window.innerWidth, h = window.innerHeight;
    if (this.glowRef.current) this.glowRef.current.style.transform = 'translate3d(' + (this.x * w * 0.32).toFixed(1) + 'px,' + (this.y * h * 0.32).toFixed(1) + 'px,0)';
    const p = this.lastP || 0;
    if (this.markRef.current) this.markRef.current.style.transform = 'translate3d(' + (this.x * 9).toFixed(2) + 'px,' + (this.y * 7 + p * h * 0.18).toFixed(1) + 'px,0) scale(' + (1 - p * 0.12).toFixed(4) + ')';
    if (Math.abs(this.tx - this.x) > 0.001 || Math.abs(this.ty - this.y) > 0.001) this.kick();
  }
  componentWillUnmount() {
    clearInterval(this.clockT); clearInterval(this.wander); cancelAnimationFrame(this.raf); cancelAnimationFrame(this.sraf);
    if (this.io) this.io.disconnect();
    if (this.onMove) window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.fit);
    window.removeEventListener('orientationchange', this.onVh);
  }

  renderVals() {
    const m = this.state.mail;
    return {
      markRef: this.markRef, inkRef: this.inkRef, topRef: this.topRef, footRef: this.footRef, glowRef: this.glowRef,
      twoRef: this.twoRef, smallRef: this.smallRef, bigRef: this.bigRef, clockRef: this.clockRef,
      mailWordOp: m ? 0 : 1, mailAddrOp: m ? 1 : 0,
      showMail: () => this.setState({ mail: true }), hideMail: () => this.setState({ mail: false })
    };
  }
}
</script>
</body>
</html>
