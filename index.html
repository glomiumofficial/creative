<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glomium — creative INFINITELY</title>
<meta name="description" content="Glomium Technologies Pvt Ltd — creative INFINITELY.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Glomium — creative INFINITELY">
<meta property="og:description" content="Glomium Technologies Pvt Ltd">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/wordmark-green.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/wordmark-green.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root { --green: #10AF8B; --green-deep: #0A6E58; --ink: #0A6E58; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: 'Jost', Helvetica, sans-serif; overflow-x: hidden; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: #064A3B; }
  ::selection { background: var(--green); color: #FFFFFF; }
  @keyframes cue { 0%,100% { transform: translateY(0); opacity: .3 } 50% { transform: translateY(9px); opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { [data-el="cue"] div { animation: none } }
</style>
</head>
<body>
<div style="position:relative; width:100%; background:#FFFFFF">
  <div data-el="track" style="position:relative; height:620vh">
    <div data-el="stage" style="position:sticky; top:0; height:100vh; height:100svh; overflow:hidden">

      <div data-el="depth" style="position:absolute; inset:-12%; z-index:0; pointer-events:none; background:radial-gradient(98% 92% at 50% 42%, rgba(16,175,139,.05), rgba(16,175,139,.018) 38%, rgba(16,175,139,.004) 66%, rgba(255,255,255,0) 88%); will-change:transform"></div>

      <div data-layer="story" style="position:absolute; inset:0; z-index:1; pointer-events:none">
        <svg data-el="inf" viewBox="0 40 40 30" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; display:block; will-change:opacity">
          <path d="M20,50 C20,10 60,10 100,50 C140,90 180,90 180,50 C180,10 140,10 100,50 C60,90 20,90 20,50 Z" fill="none" stroke="var(--green)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
        </svg>

        <p data-el="line" style="position:absolute; right:max(20px,3.4vw); bottom:clamp(72px,13vh,132px); width:min(430px,52vw); margin:0; font-size:clamp(17px,1.75vw,26px); font-weight:200; line-height:1.55; letter-spacing:.01em; color:var(--ink); text-align:right; opacity:0; will-change:transform,opacity; text-wrap:pretty">We build the systems that carry a business forward — and then we keep them running.</p>

        <div data-el="payoff" style="position:absolute; left:0; top:0; opacity:0; font-size:100px; line-height:1; font-weight:200; color:var(--ink); white-space:nowrap; letter-spacing:.34em; transform-origin:0 0; will-change:transform,opacity; filter:drop-shadow(0 14px 28px rgba(10,110,88,.14))"><span style="font-weight:200; letter-spacing:.2em; color:var(--green-deep)">creative </span>INFINITELY</div>
      </div>

      <div data-layer="head" style="position:absolute; inset:0; z-index:4; pointer-events:none">
        <img data-el="wm" src="assets/wordmark-green.png" alt="Glomium" decoding="async" style="position:absolute; left:0; top:0; width:clamp(220px,min(78vw,62vh),760px); transform-origin:0 0; display:block; will-change:transform; filter:drop-shadow(0 10px 22px rgba(10,110,88,.16))">
        <div data-el="nav" style="position:absolute; right:clamp(18px,4vw,40px); top:clamp(22px,3.4vw,34px); display:flex; gap:clamp(16px,2.4vw,30px); align-items:center; opacity:0; visibility:hidden; pointer-events:auto; font-size:clamp(10px,1.1vw,11px); letter-spacing:.24em; text-transform:uppercase; color:var(--ink)">
          <a href="#footer">Studio</a>
          <a href="mailto:hello@glomium.in">hello@glomium.in</a>
        </div>
        <div data-el="cue" style="position:absolute; left:50%; bottom:clamp(22px,4vh,38px); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; will-change:opacity">
          <span style="font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink)">Scroll</span>
          <div style="width:1px; height:clamp(26px,4.4vh,40px); background:linear-gradient(180deg,var(--green),transparent); animation:cue 2.4s ease-in-out infinite"></div>
        </div>
      </div>

    </div>
  </div>

  <footer id="footer" data-el="footer" style="position:relative; z-index:5; background:#FFFFFF; padding:clamp(34px,5vh,58px) clamp(20px,8vw,120px) clamp(24px,3.4vh,34px); border-top:1px solid rgba(16,175,139,.12); display:flex; flex-direction:column; gap:clamp(18px,2.6vh,26px)">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:22px 40px">
      <img src="assets/wordmark-green.png" alt="Glomium" loading="lazy" decoding="async" style="width:clamp(104px,13vw,134px); display:block">
      <a href="mailto:hello@glomium.in" style="font-size:clamp(15px,1.7vw,20px); font-weight:300; letter-spacing:.015em; color:var(--green-deep)">hello@glomium.in</a>
    </div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px 28px">
      <span style="font-size:clamp(10px,1.05vw,11px); letter-spacing:.14em; text-transform:uppercase; color:#67736F">© 2026 Glomium Technologies Pvt Ltd</span>
      <span style="font-size:clamp(10px,1.05vw,11px); letter-spacing:.26em; text-transform:uppercase; color:#67736F">creative <span style="color:#48544F; letter-spacing:.3em">INFINITELY</span></span>
    </div>
  </footer>
</div>
<script src="site.js"></script>
</body>
</html>
